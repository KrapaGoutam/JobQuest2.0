name: M1 CI

on:
  push:
    branches: [feature/**, development]
  pull_request:
    branches: [development]
  workflow_dispatch:

concurrency:
  group: m1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Lint · typecheck · unit · build · bundle check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      - run: pnpm check:bundle
      - name: Secret hygiene
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then echo "committed .env file"; exit 1; fi
          if git grep -nE 'sb_secret_[A-Za-z0-9]{8,}|service_role\.[A-Za-z0-9]{10,}' -- ':!*.md'; then echo "secret-like value committed"; exit 1; fi

  database:
    name: Migrations · RLS · façade integration (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Start disposable Supabase stack (applies supabase/migrations)
        run: pnpm exec supabase start -x studio,imgproxy,vector,logflare,realtime,storage-api,edge-runtime,postgres-meta,supavisor
      - name: Write CI env (local stack only — nothing leaves the runner)
        run: |
          pnpm exec supabase status -o env > /tmp/sb.env
          . /tmp/sb.env
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "SUPABASE_SECRET_KEY=${SECRET_KEY:-$SERVICE_ROLE_KEY}"
            echo "SUPABASE_DB_URL=$DB_URL"
            echo "APP_ORIGINS=http://localhost:5173"
          } > .env.local
      - run: pnpm test:integration
        env:
          M1_ENVIRONMENT: ci-local
      - if: always()
        run: pnpm exec supabase stop --no-backup
