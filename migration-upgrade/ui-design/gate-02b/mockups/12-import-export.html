<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/lucide.css"><link rel="stylesheet" href="assets/jq.css"><script src="assets/jq.js"></script>
<style>.steps{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.steps b{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;background:var(--surface-3);color:var(--fg)}
.steps .on{color:var(--fg);font-weight:600}.steps .on b{background:var(--primary);color:var(--primary-fg)}.steps .done b{background:var(--success);color:#fff}.steps .ln{width:28px;height:1px;background:var(--border-strong)}
.drop{border:2px dashed var(--border-strong);border-radius:10px;padding:28px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;background:var(--surface)}
.stat{padding:12px 16px;border-left:1px solid var(--border)}.stat:first-child{border-left:0}.stat b{font-size:20px;font-weight:600}
.ds{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border)}</style>
</head><body><script>
const { shell, gallery } = JQ;
const steps = n => `<div class="steps">${['Choose data', 'Match columns', 'Review', 'Done'].map((s, i) => `${i ? '<span class="ln"></span>' : ''}<span class="row ${i + 1 === n ? 'on' : i + 1 < n ? 'done' : ''}" style="gap:6px"><b>${i + 1 < n ? '<i class="icon-check"></i>' : i + 1}</b>${s}</span>`).join('')}</div>`;
const tabs = t => `<div class="tabs"><span class="tab ${t === 'import' ? 'sel' : ''}">Import</span><span class="tab ${t === 'hist' ? 'sel' : ''}">Import history <span class="cnt">6</span></span><span class="tab ${t === 'export' ? 'sel' : ''}">Export</span></div>`;
const head = (t, mgr) => `<div class="page-title"><h1>Import &amp; export</h1><span class="muted">${mgr ? 'Career Lab · Cohort 7' : 'Personal'}</span></div>${tabs(t)}`;
const opt = (on, t, d) => `<div class="row" style="border:1px solid ${on ? 'var(--primary)' : 'var(--border-strong)'};${on ? 'background:var(--primary-soft);' : ''}border-radius:8px;padding:9px 11px;gap:10px;align-items:flex-start"><span class="radio ${on ? 'on' : ''}" style="margin-top:2px"></span><div><div class="b">${t}</div><div class="small muted">${d}</div></div></div>`;

const step1 = mgr => `<div class="page" style="gap:12px;padding:16px 24px 0">${head('import', mgr)}
  <div class="row">${steps(1)}</div>
  <div style="display:grid;grid-template-columns:1.3fr 1fr;gap:16px;flex:none;align-items:start">
    <div class="col" style="gap:12px">
      <div class="field"><label class="label">Format</label><div class="seg"><span class="on"><i class="icon-file-spreadsheet"></i>CSV</span><span><i class="icon-file-json"></i>JSON</span><span><i class="icon-text"></i>Structured text</span></div></div>
      <div class="drop"><i class="icon-upload" style="font-size:24px;color:var(--muted)"></i><div class="b">Drop a CSV file here, or <a>choose a file</a></div><div class="small muted">Or <a>paste the data</a>. Up to 5,000 rows · 5 MB.</div></div>
      <div class="card row" style="padding:10px 14px"><i class="icon-file-spreadsheet muted" style="font-size:18px"></i><div class="grow"><div class="b">linkedin-export-sep.csv</div><div class="small muted">53 rows · 14 columns · 38 KB</div></div><span class="btn sm ghost"><i class="icon-x"></i></span></div>
    </div>
    <div class="col" style="gap:12px">
      ${mgr ? '<div class="field"><label class="label">Import for <span class="req">*</span></label><div class="input"><span class="av" style="width:20px;height:20px;font-size:9px">TW</span>Tom Weiss<i class="icon-chevron-down muted" style="margin-left:auto"></i></div><div class="help">Records are owned by this member. Recorded in Audit history.</div></div>' : ''}
      <div class="field"><label class="label">If a row has errors</label><div class="col" style="gap:6px">${opt(1, 'Import the valid rows', 'Rows with errors are skipped and listed.')}${opt(0, 'Import nothing', 'All rows must be valid (all-or-nothing).')}</div></div>
      <div class="field"><label class="label">If an application already exists</label><div class="col" style="gap:6px">${opt(1, 'Skip it', 'Same company, role and date (and URL if given).')}${opt(0, 'Import anyway', 'Creates a second application.')}${opt(0, 'Update the existing one', 'Fills in fields from the file.')}</div></div>
    </div></div>
  <div class="row" style="margin-top:auto;padding:12px 0;border-top:1px solid var(--border)"><a class="small"><i class="icon-download"></i> Download a CSV template</a><span class="grow"></span><span class="btn">Cancel</span><span class="btn primary">Continue<i class="icon-arrow-right"></i></span></div></div>`;

const MAP = [['Company Name', 'Company', 'alias'], ['Title', 'Role', 'alias'], ['Applied Date', 'Date applied', 'alias'], ['Status', 'Stage / outcome', 'alias'], ['URL', 'Job URL', 'alias'], ['Location', 'Location', ''], ['Source', 'Source', ''], ['Salary', 'Salary text', ''], ['Notes', 'Notes', ''], ['Recruiter', 'Recruiter name', ''], ['Easy Apply', '', 'unknown'], ['Connections', '', 'unknown'], ['Resume', 'Resume version', 'alias'], ['Tags', 'Tags', '']];
const step2 = `<div class="page" style="gap:12px;padding:16px 24px 0">${head('import')}
  <div class="row">${steps(2)}</div>
  <div class="banner warning small"><i class="icon-triangle-alert warning-t"></i><span><b>2 columns aren't JobQuest fields.</b> Choose a field or <b>Don't import</b>. Nothing is dropped unless you say so.</span></div>
  <div class="tbl"><div class="tr th" style="grid-template-columns:1fr 36px 1.2fr 1.4fr"><span>Column in your file</span><span></span><span>JobQuest field</span><span>Example value</span></div>
    ${MAP.map((m, i) => `<div class="tr" style="grid-template-columns:1fr 36px 1.2fr 1.4fr;height:40px;${m[2] === 'unknown' ? 'background:var(--warning-soft)' : ''}"><span class="b">${m[0]}</span><i class="icon-arrow-right muted"></i>
      <div class="input" style="height:30px;${m[2] === 'unknown' ? 'border-color:var(--warning)' : ''}">${m[1] || '<span class="warning-t">Choose a field…</span>'}${m[2] === 'alias' ? '<span class="sfx xs">matched automatically</span>' : ''}<i class="icon-chevron-down muted" style="${m[2] === 'alias' ? '' : 'margin-left:auto'}"></i></div>
      <span class="small muted ell">${['Halcyon Health', 'Senior Product Designer', '2026-09-14', 'Interviewing', 'linkedin.com/jobs/view/40211', 'Boston, MA', 'LinkedIn', '$150–175k', 'Referred by…', 'Dana Cole', 'Yes', '12', 'Product v3', 'health, senior'][i]}</span></div>`).join('')}</div>
  <div class="row" style="padding:12px 0;border-top:1px solid var(--border)"><span class="btn"><i class="icon-arrow-left"></i>Back</span><span class="grow"></span><span class="btn primary disabled">Review 53 rows<i class="icon-arrow-right"></i></span></div></div>`;

const R = [[1, 'ok', 'Halcyon Health', 'Senior Product Designer', 'Applied', ''], [2, 'ok', 'Quarry Health', 'UX Researcher', 'Saved', ''], [3, 'dup', 'Corvid Labs', 'Staff Product Designer', 'Applied', 'Already tracked (same company, role, date) · will be skipped'], [4, 'err', '', 'Product Designer', 'Applied', 'Company is required'], [5, 'ok', 'Fernway Studio', 'Product Designer', 'Rejected', 'Stage "Rejected" → stage Applied, outcome Rejected'], [6, 'err', 'Glassline', 'UX Designer', 'Applied', 'Job URL must start with http:// or https:// (was "javascript:…")'], [7, 'warn', 'Kite Mobility', 'Product Designer', 'Interviewing', '"Interviewing" matched to stage Interview'], [8, 'ok', 'Mosaic Health', 'Senior Designer', 'Applied', ''], [9, 'err', 'Driftwood AI', 'Designer', 'Bookmarked', 'Unknown stage "Bookmarked". Use a JobQuest stage (e.g. Saved).'], [10, 'dup', 'Tessellate', 'Design Systems Designer', 'Offer', 'Already tracked · will be skipped']];
const ST = { ok: ['circle-check', 'success-t', 'Ready'], warn: ['triangle-alert', 'warning-t', 'Check'], dup: ['copy', 'info-t', 'Duplicate'], err: ['circle-x', 'danger-t', 'Error'] };
const step3 = theme => `<div class="page" style="gap:12px;padding:16px 24px 0">${head('import')}
  <div class="row">${steps(3)}</div>
  <div class="card row" style="gap:0;flex:none"><div class="stat grow"><div class="small muted">Ready to import</div><b class="success-t">42</b></div><div class="stat grow"><div class="small muted">Need a look</div><b class="warning-t">5</b></div><div class="stat grow"><div class="small muted">Duplicates · skipped</div><b class="info-t">3</b></div><div class="stat grow"><div class="small muted">Errors · not imported</div><b class="danger-t">3</b></div></div>
  <div class="row" style="gap:6px"><span class="chip sm inv">All 53</span><span class="chip sm"><i class="icon-circle-x danger-t"></i>Errors 3</span><span class="chip sm"><i class="icon-triangle-alert warning-t"></i>Check 5</span><span class="chip sm"><i class="icon-copy info-t"></i>Duplicates 3</span><span class="grow"></span><a class="small"><i class="icon-download"></i> Download error report (CSV)</a></div>
  <div class="tbl"><div class="tr th" style="grid-template-columns:48px 110px 1fr 1fr 110px 2fr"><span>Row</span><span>Result</span><span>Company</span><span>Role</span><span>Stage</span><span>Message</span></div>
    ${R.map(r => `<div class="tr" style="grid-template-columns:48px 110px 1fr 1fr 110px 2fr;${r[1] === 'err' ? 'background:var(--danger-soft)' : ''}"><span class="muted">${r[0]}</span><span class="row ${ST[r[1]][1]} b small" style="gap:5px"><i class="icon-${ST[r[1]][0]}"></i>${ST[r[1]][2]}</span><span class="${r[2] ? '' : 'danger-t'}">${r[2] || 'Missing'}</span><span class="ell">${r[3]}</span><span class="small">${r[4]}</span><span class="small ${r[1] === 'err' ? 'danger-t' : 'muted'}">${r[5]}</span></div>`).join('')}</div>
  <div class="row" style="padding:12px 0;border-top:1px solid var(--border);margin-top:auto"><span class="btn"><i class="icon-arrow-left"></i>Back</span><span class="small muted" style="margin-left:10px">Nothing has been saved yet.</span><span class="grow"></span><span class="btn">Cancel</span><span class="btn primary">Import 47 applications</span></div></div>`;

const step4 = `<div class="page" style="gap:12px;padding:16px 24px 0">${head('import')}
  <div class="row">${steps(4)}</div>
  <div class="card" style="padding:24px;display:flex;gap:18px;align-items:flex-start;flex:none"><span class="tile lg" style="background:var(--success-soft);color:var(--success);border-radius:50%"><i class="icon-check"></i></span>
    <div class="grow col" style="gap:10px"><div style="font-size:18px;font-weight:600">Imported 47 applications</div>
      <div class="row" style="gap:22px"><span><b>47</b> created</span><span><b>0</b> updated</span><span class="info-t"><b>3</b> skipped as duplicates</span><span class="danger-t"><b>3</b> rejected</span></div>
      <div class="small muted">Each new application has an "Imported" event on its timeline. Batch #7 · Sep 23, 10:42 AM.</div>
      <div class="row" style="gap:8px"><span class="btn primary"><i class="icon-briefcase"></i>View imported applications</span><span class="btn"><i class="icon-download"></i>Error report (3 rows)</span><span class="btn">Import another file</span></div></div></div>
  <div class="card"><div class="card-h"><span class="card-t">Recent imports</span><a class="small" style="margin-left:auto">All history</a></div>
    ${[['#7', 'linkedin-export-sep.csv', 'Sep 23', '47 created · 3 skipped · 3 rejected'], ['#6', 'Pasted structured text', 'Sep 02', '5 created'], ['#5', 'tracker-backup.json', 'Aug 18', '112 created · 4 updated']].map(h => `<div class="tr" style="grid-template-columns:40px 1.4fr 100px 1.4fr 90px;border-bottom:1px solid var(--border)"><span class="muted">${h[0]}</span><span class="b ell">${h[1]}</span><span class="small muted">${h[2]}</span><span class="small">${h[3]}</span><a class="small">Rows</a></div>`).join('')}</div></div>`;

const DS = [['briefcase', 'Applications', '600 rows', 'CSV · Excel · JSON'], ['messages-square', 'Interviews', '41', 'CSV'], ['circle-x', 'Rejections', '58', 'CSV'], ['reply', 'Follow-ups', '96', 'CSV'], ['users', 'Contacts (networking)', '142', 'CSV'], ['bell-ring', 'Reminders', '37', 'CSV'], ['target', 'Goals', '26 weeks', 'CSV'], ['list-checks', 'Tasks', '84', 'CSV'], ['repeat', 'Habits', '7 · 412 logs', 'CSV'], ['notebook-pen', 'Journal / notes', '86', 'CSV'], ['file-text', 'Resume performance', '4', 'CSV'], ['hourglass', 'Aging report', '181', 'CSV'], ['timer', 'Stage durations', '8', 'CSV']];
const exportPage = mgr => `<div class="page" style="gap:12px;padding:16px 24px 0">${head('export', mgr)}
  <div class="row" style="gap:8px">${mgr ? '<span class="small b">Scope</span><div class="seg"><span class="on">Whole workspace · 12 members</span><span>One member</span></div><span class="small muted row" style="gap:5px"><i class="icon-history"></i>Workspace-wide exports are recorded in Audit history.</span>' : '<span class="small muted">Everything you own in Personal, including archived records.</span>'}</div>
  <div style="display:grid;grid-template-columns:1fr 360px;gap:16px;flex:none;align-items:start">
    <div class="card" style="overflow:hidden">${DS.map(d => `<div class="ds"><i class="icon-${d[0]} muted" style="font-size:16px"></i><div><div class="b">${d[1]}</div><div class="small muted">${mgr && d[1] === 'Applications' ? '7,214 rows' : d[2]}</div></div><span class="row" style="gap:6px">${d[3].split(' · ').map(x => `<span class="btn sm"><i class="icon-download"></i>${x}</span>`).join('')}</span></div>`).join('')}</div>
    <div class="col" style="gap:12px"><div class="card"><div class="card-b col" style="gap:10px"><div class="row"><i class="icon-archive muted" style="font-size:18px"></i><b>Full backup (JSON)</b></div><div class="small muted">All your records in one file: applications with timelines, snapshots, contacts, tasks, habits, journal, goals, settings.</div><span class="btn primary"><i class="icon-download"></i>Download backup</span><div class="xs muted">Restoring from a backup isn't available yet.</div></div></div>
      <div class="banner neutral small" style="align-items:flex-start"><i class="icon-shield-check success-t" style="margin-top:2px"></i><span>Spreadsheet cells starting with <span class="mono">= + - @</span> are neutralised so they can't run as formulas.</span></div></div></div></div>`;

const denied = `<div class="page" style="gap:12px;padding:16px 24px 0"><div class="page-title"><h1>Import &amp; export</h1><span class="muted">Northside Bootcamp</span></div>${tabs('export')}
  <div class="banner info" style="align-items:flex-start"><i class="icon-shield info-t" style="margin-top:2px"></i><div><b>You're a User in this workspace</b><div class="small muted">You can import and export <b>your own</b> records. Workspace-wide export and importing for other members need the Manager role. Ask a manager (Riya Shah) if you need more.</div></div></div>
  <div class="card" style="overflow:hidden;opacity:1">${DS.slice(0, 5).map(d => `<div class="ds"><i class="icon-${d[0]} muted" style="font-size:16px"></i><div><div class="b">${d[1]}</div><div class="small muted">Your records only</div></div><span class="btn sm"><i class="icon-download"></i>CSV</span></div>`).join('')}</div></div>`;

gallery('Import & export',
  'Import keeps JobQuest 1.0 behaviour: preview before commit, valid-rows-only vs all-or-nothing, 3 duplicate actions, the alias table, http(s)-only URLs, and nothing dropped silently. It adds an explicit column-matching step (CR-G2B-03) and a downloadable error report (CR-016). Export shows its scope and neutralises formula injection on every file.',
  [
    { title: 'Import wizard', items: [
      { cap: 'E1 · Choose data', sub: '1440 · light', html: shell({ theme: 'light', active: 'settings', crumb: 'Settings / Import & export' }, step1(false)) },
      { cap: 'E2 · Choose data (manager)', sub: '1440 · dark · import for a member', html: shell({ theme: 'dark', ws: 'lab', active: 'import', crumb: 'Import & export' }, step1(true)) },
      { cap: 'E3 · Match columns', sub: '1440 · light · aliases auto-matched, unknown columns must be resolved', html: shell({ theme: 'light', active: 'settings', crumb: 'Settings / Import & export' }, step2) },
      { cap: 'E4 · Review', sub: '1440 · light · errors, warnings, duplicates', html: shell({ theme: 'light', active: 'settings', crumb: 'Settings / Import & export' }, step3()) },
      { cap: 'E5 · Review', sub: '1440 · dark', html: shell({ theme: 'dark', active: 'settings', crumb: 'Settings / Import & export' }, step3()) },
      { cap: 'E6 · Done', sub: '1440 · light · results summary', html: shell({ theme: 'light', active: 'settings', crumb: 'Settings / Import & export' }, step4) }
    ]},
    { title: 'Export & permissions', items: [
      { cap: 'E7 · Export', sub: '1440 · light · personal', html: shell({ theme: 'light', active: 'settings', crumb: 'Settings / Import & export' }, exportPage(false)) },
      { cap: 'E8 · Export (manager)', sub: '1440 · dark · workspace scope', html: shell({ theme: 'dark', ws: 'lab', active: 'import', crumb: 'Import & export' }, exportPage(true)) },
      { cap: 'E9 · User role in a shared workspace', sub: '1440 · light · permission explanation', html: shell({ theme: 'light', ws: 'nb', active: 'settings', crumb: 'Settings / Import & export' }, denied) }
    ]}
  ]);
</script></body></html>
