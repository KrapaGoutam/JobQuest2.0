<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/lucide.css"><link rel="stylesheet" href="assets/jq.css"><script src="assets/jq.js"></script>
<style>.bar{display:block;height:8px;border-radius:3px;background:var(--surface-muted);position:relative;overflow:hidden}.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--primary);border-radius:3px}
.acc{border-bottom:1px solid var(--border);padding:0 16px;height:44px;display:flex;align-items:center;gap:8px;background:var(--surface)}</style>
</head><body><script>
const { shell, gallery, pips, pri, aging } = JQ;
const rate = (n, d) => d < 5 ? `<span class="muted">${n}/${d} · <i>too few</i></span>` : `<span class="nowrap"><b>${n}</b>/${d} <span class="muted">(${(n / d * 100).toFixed(1)}%)</span></span>`;

/* ---------- Resumes ---------- */
const D = [['Product v3', 'Resume', 'Default', 58, [17, 58], [10, 58], 'Sep 01', 0], ['↳ Product v3 · health focus', 'Resume', 'Revision of v3', 9, [3, 9], [2, 9], 'Sep 14', 1], ['Product v2', 'Resume', '', 49, [8, 49], [5, 49], 'Jul 10', 0], ['Research-lean', 'Resume', '', 21, [4, 21], [2, 21], 'Jun 28', 0], ['Cover letter · general', 'Cover letter', 'Default', 32, [9, 32], [5, 32], 'Aug 02', 0], ['Product v1', 'Resume', 'Archived', 3, [0, 3], [0, 3], 'Apr 04', 0]];
const resumes = `<div class="page" style="gap:12px;padding:16px 24px 0">
  <div class="page-title"><h1>Resumes</h1><span class="muted">4 resumes · 1 cover letter · 1 archived</span><span class="spacer"></span><span class="btn"><i class="icon-git-compare"></i>Compare</span><span class="btn primary"><i class="icon-plus"></i>New version</span></div>
  <div class="banner neutral small"><i class="icon-info muted"></i><span>Versions are tracked as names and notes. File upload isn't available yet; the design keeps a slot for it.</span></div>
  <div class="tbl"><div class="tr th" style="grid-template-columns:1.6fr 110px 130px 70px 1fr 1fr 90px 120px"><span>Version</span><span>Type</span><span>Status</span><span>Used</span><span>Response rate</span><span>Reached interview</span><span>Updated</span><span></span></div>
    ${D.map(d => `<div class="tr" style="grid-template-columns:1.6fr 110px 130px 70px 1fr 1fr 90px 120px;${d[2] === 'Archived' ? 'color:var(--muted)' : ''}"><span class="row ${d[7] ? '' : 'b'}" style="${d[7] ? 'padding-left:14px' : ''}"><i class="icon-${d[1] === 'Resume' ? 'file-text' : 'mail'} muted"></i><span class="ell">${d[0]}</span></span><span class="small">${d[1]}</span><span>${d[2] === 'Default' ? '<span class="pill accent">Default</span>' : d[2] === 'Archived' ? '<span class="pill muted">Archived</span>' : d[2] ? `<span class="small muted">${d[2]}</span>` : ''}</span><span class="small">${d[3]}</span><span class="small">${rate(...d[4])}</span><span class="small">${rate(...d[5])}</span><span class="small muted">${d[6]}</span><span class="row" style="justify-content:flex-end;gap:4px"><span class="btn sm"><i class="icon-copy-plus"></i>Clone</span><span class="ibtn ghost"><i class="icon-ellipsis"></i></span></span></div>`).join('')}</div>
  <div class="small muted">A version can't be deleted while applications use it; archive it instead. Rates count applications that <b>ever reached</b> each step.</div></div>`;

const compare = `<div class="page" style="gap:12px;padding:16px 24px 0">
  <div class="page-title"><a class="small row" style="gap:4px"><i class="icon-arrow-left"></i>Resumes</a></div>
  <div class="page-title" style="margin-top:-6px"><h1>Compare versions</h1></div>
  <div style="display:grid;grid-template-columns:200px 1fr 1fr;gap:0;flex:none" class="card">
    ${[['', '<div class="input">Product v3<i class="icon-chevron-down muted" style="margin-left:auto"></i></div>', '<div class="input">Product v2<i class="icon-chevron-down muted" style="margin-left:auto"></i></div>'],
      ['Target role', 'Product / Staff designer', 'Product designer'], ['Category', 'Product design', 'Product design'], ['Created', 'Sep 01 · revision of v2', 'Jul 10'], ['Change summary', 'Leads with design-system impact; cut agency work', '—'],
      ['Applications', '58', '49'], ['Response rate', rate(17, 58), rate(8, 49)], ['Reached interview', rate(10, 58), rate(5, 49)], ['Reached offer', rate(2, 58), rate(0, 49)], ['Rejected', '21', '24']].map((r, i) => `<div style="padding:10px 16px;border-bottom:1px solid var(--border);color:var(--muted);${i ? '' : 'background:var(--surface-muted)'}">${r[0]}</div><div style="padding:10px 16px;border-bottom:1px solid var(--border);border-left:1px solid var(--border);${i ? '' : 'background:var(--surface-muted)'}">${r[1]}</div><div style="padding:10px 16px;border-bottom:1px solid var(--border);border-left:1px solid var(--border);${i ? '' : 'background:var(--surface-muted)'}">${r[2]}</div>`).join('')}
  </div>
  <div class="banner neutral small"><i class="icon-info muted"></i><span>Sample sizes differ, and roles you applied to with each version differ too. Treat differences under ~10 points as noise.</span></div></div>`;

/* ---------- Goals (Analytics › Goals) ---------- */
const G = [['Applications', 15, 11, 'week'], ['Follow-ups sent', 10, 12, 'week'], ['New connections', 5, 2, 'week'], ['Recruiter messages', 3, 3, 'week'], ['Interview prep', 120, 45, 'week', 'min']];
const goals = `<div class="page" style="gap:12px;padding:16px 24px 0">
  <div class="page-title"><h1>Analytics</h1><span class="muted">Goals · week of Sep 21 (Monday start)</span><span class="spacer"></span><span class="btn"><i class="icon-target"></i>Edit targets</span></div>
  <div class="tabs"><span class="tab">Overview</span><span class="tab">Stage timing</span><span class="tab">Aging</span><span class="tab sel">Goals</span></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:none;align-items:start">
  <div class="card"><div class="card-h"><span class="card-t">This week</span><span class="small muted">Wed · 3 days left</span></div><div class="card-b col" style="gap:12px">
    ${G.map(g => `<div><div class="row small"><b>${g[0]}</b><span class="grow"></span><span>${g[2]} / ${g[1]}${g[4] ? ' min' : ''}</span>${g[2] >= g[1] ? '<i class="icon-circle-check success-t"></i>' : ''}</div><span class="bar" style="margin-top:4px"><i style="width:${Math.min(100, g[2] / g[1] * 100)}%;${g[2] >= g[1] ? 'background:var(--success)' : ''}"></i></span></div>`).join('')}
    <div class="small muted">Actuals are counted from your activity; they aren't typed in. Weekly periods use your week start.</div></div></div>
  <div class="card"><div class="card-h"><span class="card-t">History</span><span class="small muted">Last 8 weeks · target met</span></div>
    <div class="tbl" style="border:0;border-radius:0">${[['Week', 'Apps', 'Follow-ups', 'Connections', 'Streak'], ['Sep 14', '14/15', '9/10', '5/5 ✓', '—'], ['Sep 7', '16/15 ✓', '11/10 ✓', '3/5', '2 wks apps'], ['Aug 31', '15/15 ✓', '10/10 ✓', '5/5 ✓', ''], ['Aug 24', '10/15', '6/10', '2/5', ''], ['Aug 17', '13/12 ✓', '8/8 ✓', '4/5', '']].map((r, i) => `<div class="tr ${i ? '' : 'th'}" style="grid-template-columns:80px 1fr 1fr 1fr 1fr;height:36px;font-size:12px">${r.map(c => `<span class="${/✓/.test(c) ? 'success-t b' : ''}">${c.replace(' ✓', ' <i class="icon-check"></i>')}</span>`).join('')}</div>`).join('')}</div>
    <div class="small muted" style="padding:10px 16px">Past weeks are frozen snapshots: later edits don't change them. Changing a target starts from the chosen date.</div></div></div></div>`;

/* ---------- Tablet (1024×768) ---------- */
const APPS = [['Northwind Analytics', 'Product Designer II', 2, 'Applied', 'Send 2nd follow-up', '5d overdue', 'danger'], ['Meridian Bank', 'UX Designer', 2, 'Applied', 'Final follow-up or close', '4d overdue', 'danger'], ['Aster Mobility', 'Principal Designer', 2, 'Applied', 'Ask Jonah for intro', '2d overdue', 'danger'], ['Lumen Civic', 'Senior Designer', 3, 'Recruiter Screen', 'Follow up with hiring manager', '1d overdue', 'danger'], ['Corvid Labs', 'Staff Product Designer', 4, 'Final Interview', 'Send thank-you note', 'Today', 'warning'], ['Oakridge Energy', 'Senior UX Researcher', 1, 'Preparing', 'Tailor resume & apply', 'Today', 'warning'], ['Halcyon Health', 'Senior Product Designer', 3, 'Recruiter Screen', 'Prep recruiter call', 'Tomorrow', ''], ['Quarry Health', 'Senior Product Designer', 3, 'Recruiter Screen', 'Schedule screen', 'Tomorrow', ''], ['Brightline Freight', 'Lead UX Designer', 4, 'Interview', 'Portfolio review prep', 'Sep 25', ''], ['Tessellate', 'Design Systems Designer', 5, 'Offer', 'Review offer terms', 'Sep 28', '']];
const due = (d, c) => c === 'danger' ? `<span class="danger-t b row nowrap" style="gap:3px"><i class="icon-triangle-alert"></i>${d}</span>` : c === 'warning' ? `<span class="warning-t b row nowrap" style="gap:3px"><i class="icon-clock"></i>${d}</span>` : `<span class="muted row nowrap" style="gap:3px"><i class="icon-calendar"></i>${d}</span>`;
const tApps = `<div class="page" style="gap:8px;padding:14px 16px 0 20px">
  <div class="page-title"><h1>Applications</h1><span class="muted">457 active</span><span class="spacer"></span><span class="ibtn"><i class="icon-download"></i></span></div>
  <div class="tabs" style="gap:16px"><span class="tab sel">All active <span class="cnt">457</span></span><span class="tab">Follow-up <span class="cnt danger">7</span></span><span class="tab">Interviewing <span class="cnt">11</span></span><span class="tab">Saved <span class="cnt">38</span></span><span class="tab">More<i class="icon-chevron-down"></i></span></div>
  <div class="row" style="gap:6px"><div class="input ph" style="width:170px;height:32px"><i class="icon-list-filter"></i>Filter</div><span class="chip on">Outcome: Open<i class="icon-x"></i></span><span class="chip add"><i class="icon-sliders-horizontal"></i>Filters</span><span class="grow"></span><span class="seg"><span class="on"><i class="icon-table"></i></span><span><i class="icon-square-kanban"></i></span><span><i class="icon-calendar"></i></span><span><i class="icon-chart-gantt"></i></span></span></div>
  <div class="tbl"><div class="tr th" style="grid-template-columns:16px 1fr 150px 230px"><span class="cb"></span><span>Company · Role</span><span>Stage</span><span>Next action</span></div>
  ${APPS.map(a => `<div class="tr" style="grid-template-columns:16px 1fr 150px 230px"><span class="cb"></span><span class="row" style="min-width:0"><span class="tile">${a[0][0]}</span><span class="grow" style="min-width:0"><div class="b ell">${a[0]}</div><div class="small muted ell">${a[1]}</div></span></span><span class="row small nowrap">${pips(a[2])}${a[3]}</span><span class="col small" style="min-width:0"><span class="ell">${a[4]}</span>${due(a[5], a[6])}</span></div>`).join('')}</div></div>`;

const tDetail = `<div style="background:var(--surface);padding:12px 20px 0;border-bottom:1px solid var(--border)">
  <div class="row small"><a class="row" style="gap:4px"><i class="icon-arrow-left"></i>Applications</a><span class="grow"></span><span class="muted">5 of 457</span></div>
  <div class="row" style="gap:12px;margin:8px 0 10px"><span class="tile lg">C</span><div class="grow" style="min-width:0"><div style="font-size:20px;font-weight:600" class="ell">Staff Product Designer</div><div class="small muted ell"><b style="color:var(--fg)">Corvid Labs</b> · Seattle · Hybrid · Applied Sep 01</div></div><span class="btn"><i class="icon-message-square"></i>Log</span><span class="btn"><i class="icon-pencil"></i>Edit</span><span class="ibtn"><i class="icon-ellipsis"></i></span></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--border)">
    <div style="padding:8px 12px 10px 0"><div class="row xs b muted">STAGE<span class="grow"></span><span style="font-weight:500">Outcome: Open</span></div><div class="row" style="margin-top:6px"><b>Final Interview</b><span class="small muted">5 days</span><span class="grow"></span><span class="btn sm">Move stage<i class="icon-chevron-down"></i></span></div><div class="row small" style="gap:14px;margin-top:6px">${pri('High')}${aging('New', '1d')}</div></div>
    <div style="padding:8px 12px;background:var(--warning-soft)"><div class="row xs b warning-t"><i class="icon-clock"></i>NEXT ACTION · DUE TODAY</div><div class="b" style="margin:3px 0 6px">Send thank-you note</div><div class="row"><span class="btn sm primary"><i class="icon-check"></i>Done, set next</span><span class="btn sm">Reschedule</span></div></div></div></div>
  <div style="flex:1;overflow:hidden">
    <div style="padding:10px 20px 0;background:var(--bg)"><div class="tabs"><span class="tab sel">Timeline <span class="cnt">19</span></span><span class="tab">Job posting</span><span class="tab">Notes <span class="cnt">4</span></span></div>
    ${[['22', 'SEP', 'sticky-note', 'Note', 'Elena hinted at a decision by early October.'], ['22', 'SEP', 'calendar-check', 'Final interview completed', 'Panel · 4 interviewers'], ['18', 'SEP', 'flag', 'Stage changed', 'Interview → Final Interview']].map(e => `<div class="row" style="padding:10px 0;border-bottom:1px solid var(--border);gap:12px;align-items:flex-start"><div style="width:36px"><b style="font-size:16px">${e[0]}</b><div class="xs b muted">${e[1]}</div></div><span class="av" style="width:22px;height:22px;background:var(--surface-muted)"><i class="icon-${e[2]}"></i></span><div><b>${e[3]}</b> <span class="muted">— ${e[4]}</span></div></div>`).join('')}</div>
    <div style="margin-top:10px;border-top:1px solid var(--border)">${[['list-checks', 'Tasks & follow-ups', '2 open', 1], ['calendar-check', 'Interviews', '3'], ['users', 'Contacts', '3'], ['file-text', 'Documents', '2'], ['info', 'Details', 'Referral · CRV-2291']].map(a => `<div class="acc"><i class="icon-${a[0]} muted"></i><b>${a[1]}</b><span class="small muted">${a[2]}</span><span class="grow"></span><i class="icon-chevron-${a[3] ? 'up' : 'down'} muted"></i></div>${a[3] ? '<div style="padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border)" class="col small"><div class="row" style="height:28px"><span class="cb"></span>Send thank-you note<span class="grow"></span><span class="warning-t b">Today</span></div><div class="row" style="height:28px"><span class="cb"></span>Follow up on decision<span class="grow"></span><span class="muted">Oct 02</span></div></div>' : ''}`).join('')}</div>
  </div>`;

const tCreate = `<div class="page" style="gap:12px;padding:14px 20px 0">
  <div class="page-title"><h1>New application</h1><span class="spacer"></span></div>
  <div class="row" style="gap:6px;overflow:hidden">${['Job', 'Application', 'Tracking', 'Contacts', 'Notes'].map((s, i) => `<span class="chip sm ${i ? '' : 'inv'}">${s}</span>`).join('')}</div>
  <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:12px">
    <div class="fgrid" style="grid-template-columns:1fr 1fr">${[['Company', 'Harbor Logistics', 1], ['Role', 'Senior Product Designer', 1], ['Job URL', 'harborlogistics.example/careers', 0], ['Job / requisition ID', '', 0], ['Location', 'Chicago, IL', 0], ['Source', 'Company site', 0]].map(f => `<div class="field"><label class="label">${f[0]}${f[2] ? ' <span class="req">*</span>' : ' <span class="opt">optional</span>'}</label><div class="input ${f[1] ? '' : 'ph'}">${f[1]}</div></div>`).join('')}</div>
    <div class="field"><label class="label">Work arrangement <span class="opt">optional</span></label><div class="seg"><span>Remote</span><span class="on">Hybrid</span><span>Onsite</span></div></div></div>
  <div class="collapsed" style="background:var(--surface);border:1px solid var(--border);border-radius:8px;height:48px;padding:0 16px;display:flex;align-items:center;gap:8px"><i class="icon-send muted"></i><b>Application</b><span class="small muted">Stage Applied · Sep 23</span><i class="icon-chevron-down muted" style="margin-left:auto"></i></div>
  <div class="row" style="margin-top:auto;padding:12px 0;border-top:1px solid var(--border)"><span class="btn">Cancel</span><span class="grow"></span><span class="btn primary">Create application</span></div></div>`;

gallery('Resumes · Goals · Tablet layouts',
  'Resumes keep JobQuest 1.0 behaviour (versions, revisions, clone, compare, per-version performance, blocked delete when used), shown in the D table language. Goals live under Analytics › Goals, with live actuals and frozen weekly snapshots. Tablet frames show the 64px rail, the condensed table and the single-column detail with accordions (RESPONSIVE_SPEC).',
  [
    { title: 'Resumes & goals', items: [
      { cap: 'R1 · Resumes', sub: '1440 · light', html: shell({ theme: 'light', active: 'resumes', crumb: 'Resumes' }, resumes) },
      { cap: 'R2 · Compare versions', sub: '1440 · dark', html: shell({ theme: 'dark', active: 'resumes', crumb: 'Resumes / Compare' }, compare) },
      { cap: 'R3 · Goals', sub: '1440 · light · Analytics › Goals', html: shell({ theme: 'light', active: 'analytics', crumb: 'Analytics / Goals' }, goals) }
    ]},
    { title: 'Tablet · 1024×768', items: [
      { cap: 'TB1 · Applications (condensed table)', sub: 'tablet · light · 64px rail', html: shell({ theme: 'light', active: 'applications', crumb: 'Applications', size: 't', rail: true }, tApps) },
      { cap: 'TB2 · Application detail (single column)', sub: 'tablet · dark · rail sections as accordions', html: shell({ theme: 'dark', active: 'applications', crumb: 'Corvid Labs', size: 't', rail: true }, tDetail) },
      { cap: 'TB3 · New application', sub: 'tablet · light · section chips instead of side nav', html: shell({ theme: 'light', active: 'applications', crumb: 'New application', size: 't', rail: true }, tCreate) }
    ]}
  ]);
</script></body></html>
